name: Bug report
description: Something behaves differently from what you expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Arabic — both are read.
        اكتب بالعربية أو بالإنجليزية، كلتاهما مقروءة.

  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - VidHoist for Android
        - VidHoist for Windows
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows it.
      placeholder: "1.0.0+16"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: "Galaxy S22 Ultra, Android 16 / Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        What you did, what you expected, and what you saw instead. A
        screenshot or a screen recording says more than a paragraph.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: The link involved, if any
      description: >
        Many defects are specific to one platform's URL shape. Leave it out
        if the link is private.

  - type: textarea
    id: engine
    attributes:
      label: Engine
      description: >
        The yt-dlp version shown in Settings, and anything unusual about the
        link or site. Never paste a cookies file.
