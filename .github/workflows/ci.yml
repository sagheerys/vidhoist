name: CI

# A change to the documents alone runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code; the token they are given can do no more.
permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # One resolve for the whole workspace; every package shares it.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      # Comments are read by strangers: English, no private references, no
      # untracked TODOs, no switched-off code. Python 3 is on the runner.
      - name: Check comments
        run: python3 tool/comment-lint.py

      # mt_core and mt_transcripts are pure Dart, so they run under
      # `dart test`; the rest need the Flutter test runner.
      - name: Test mt_core
        run: dart test
        working-directory: packages/mt_core

      - name: Test mt_transcripts
        run: dart test
        working-directory: packages/mt_transcripts

      - name: Test mt_media
        run: flutter test --no-pub
        working-directory: packages/mt_media

      - name: Test mt_ui
        run: flutter test --no-pub
        working-directory: packages/mt_ui

      - name: Test vidhoist_mobile
        run: flutter test --no-pub
        working-directory: apps/vidhoist_mobile

  # One runner per app, deliberately. Both builds in a single job filled the
  # hosted runner's disk and the second one died with "No space left on
  # device" (measured 2026-09-09) — an Android SDK, a Gradle cache and two
  # sets of build output do not fit in the ~14GB a standard runner has.
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app: [vidhoist_mobile]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Debug builds only: release signing needs a keystore that is not in
      # this repository.
      - name: Build ${{ matrix.app }}
        run: flutter build apk --debug
        working-directory: apps/${{ matrix.app }}
