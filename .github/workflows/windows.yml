name: Windows

# The Windows app on a Windows runner: its tests read Windows paths and its
# build needs the Visual C++ tools and Rust (two plugins compile native code
# with it), all of which windows-latest carries.
#
# Its own workflow so it runs only when what it builds changed, or by hand:
# while the repository is private a Windows minute costs two of the monthly
# allowance. Tests and build are two jobs side by side: on the private
# runner the tests alone take about 51 minutes (2026-11-05), and one job
# holding both ran out of its hour in the build.
on:
  push:
    branches: [main]
    paths:
      - 'apps/vidhoist_desktop/**'
      - 'packages/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/fetch-engine.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'apps/vidhoist_desktop/**'
      - 'packages/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/fetch-engine.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows tests (VidHoist)
    runs-on: windows-latest
    timeout-minutes: 75

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub
        working-directory: apps/vidhoist_desktop

      # Two at a time: a private repository's Windows runner has two cores
      # and about 8 GB, and the default run stalled for minutes at a time
      # in layout_matrix_test as memory ran out (2026-11-05: 35 minutes
      # against the public parent's 10 on a 4-core, 16 GB runner).
      - name: Test vidhoist_desktop
        run: flutter test --no-pub -j 2
        working-directory: apps/vidhoist_desktop

  build:
    name: Windows build (VidHoist)
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build vidhoist_desktop
        run: flutter build windows --release --no-pub
        working-directory: apps/vidhoist_desktop

      # The installer ships yt-dlp's folder build from tools\yt-dlp, fetched
      # at the pinned version and checked against its SHA-256.
      - name: Fetch yt-dlp
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/fetch-engine.ps1

      # The installer script is code too: packing proves it still compiles
      # against the build. Inno Setup 6 is on the runner; the Visual C++
      # runtime shipped beside the app comes from its Visual Studio.
      - name: Pack the installer
        working-directory: apps/vidhoist_desktop
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --version=6.7.1 --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft.VC143.CRT not found' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DCrtDir=$crt" windows\installer\vidhoist.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Get-Item build\installer\*.exe | Format-Table Name, Length

      # Unsigned and for checking only; a release is built on the owner's
      # machine.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vidhoist-installer
          path: apps/vidhoist_desktop/build/installer/*.exe
          retention-days: 7
