name: vidhoist_mobile
description: "VidHoist for Android: download video and audio with yt-dlp, straight to the phone."
publish_to: none
resolution: workspace
version: 1.0.0+16

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  vh_core:
    path: ../../packages/vh_core
  vh_media:
    path: ../../packages/vh_media
  vh_ui:
    path: ../../packages/vh_ui
  # The subtitles yt-dlp writes beside a download, read for the player.
  vh_transcripts:
    path: ../../packages/vh_transcripts
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  # The "Wi-Fi only" gate before a download, and retrying when the network
  # comes back.
  connectivity_plus: ^6.1.0
  # The system file picker (SAF). Android 11+ forbids reading a file the app
  # did not create, so importing a backup from another device cannot work
  # from a fixed path.
  file_picker: ^10.0.0
  # The notifications of downloads that continue in the background.
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  # **Back after being removed 2026-09-05**, when it had no imports and the
  # reasoning was "the media permissions are declared in the manifest".
  # Declaring a dangerous permission does not grant it: on a phone where the
  # app had never been given media access, the first library scan threw
  # `PathAccessException ... Permission denied, errno = 13` on the Download
  # folder, and nothing ever asked the user (field report, Galaxy S22 Ultra
  # in a fresh profile, 2026-09-16).
  permission_handler: ^13.0.2
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  # The sign-in page of Settings › Accounts: the site's own login inside
  # the app, whose cookies then go to yt-dlp (`CookieJar.kt`).
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# The launcher icon. The images are generated by
# `python tool/icons/vidhoist_kit.py`, then:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  # The background is **the solid accent colour**: the mark is drawn for it
  # (cream and a soft blue), and its perforations are holes that show it.
  adaptive_icon_background: "#2457D6"
  adaptive_icon_foreground: assets/icons/icon_foreground.png
  # **No inset of the generator's own.** Its default wraps both layers in a
  # 16% inset, which shrinks them to 68% after the kit has already placed
  # the mark inside the launcher's safe circle: on the owner's phone the V
  # came out at 48% of the icon's width instead of the 64% it is drawn for.
  adaptive_icon_foreground_inset: 0
  # Android 13+ themed icons. Without this layer the system draws the
  # foreground as-is, which looks out of place among icons tinted to match the
  # wallpaper.
  adaptive_icon_monochrome: assets/icons/icon_monochrome.png
  min_sdk_android: 23
